name: Rebuild microsite after docs changes

# yamllint disable-line rule:truthy
on:
  push:
    branches: [master]
    paths: ["docs/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger microsite CI
        env:
          GH_TOKEN: ${{ secrets.MICROSITE_DISPATCH_TOKEN }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" '{event_type: "docs-updated", client_payload: {sha: $sha}}' |
          gh api --method POST repos/yopass/microsite/dispatches --input -

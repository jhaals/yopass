name: Deploy landing site to Cloudflare Pages

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
    paths:
      - "microsite/**"
      - "docs/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: read

concurrency:
  group: deploy-cloudflare-site
  cancel-in-progress: false

jobs:
  check:
    name: Check landing site changes
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deploy-check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Keep the shell control flow readable despite the scalar indentation rule.
      # yamllint disable rule:indentation
      - name: Decide whether to deploy
        id: deploy-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: deploy-cloudflare-site.yml
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            associated_prs="$(gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
            if jq -e 'any(.[]; .user.login == "dependabot[bot]")' \
              <<< "$associated_prs" > /dev/null; then
              echo "Deferring Dependabot changes to the daily deployment."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          previous_sha="$(gh api --method GET \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
            -f event=schedule -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [[ ! "$previous_sha" =~ ^[0-9a-f]{40}$ ]] || \
            ! git cat-file -e "$previous_sha^{commit}" 2> /dev/null; then
            previous_sha="$(git rev-list -1 --before='24 hours ago' HEAD)"
          fi

          latest_change="$(git log --first-parent -1 --format=%H \
            "$previous_sha..HEAD" -- \
            microsite docs)"
          if [[ -z "$latest_change" ]]; then
            echo "No landing-site changes since the previous daily check."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          associated_prs="$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/commits/$latest_change/pulls")"
          if jq -e 'any(.[]; .user.login == "dependabot[bot]")' \
            <<< "$associated_prs" > /dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "The latest landing-site change was already handled immediately."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      # yamllint enable rule:indentation

  deploy:
    name: Deploy landing site
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: Deploy
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: microsite/package-lock.json

      - name: Install dependencies
        working-directory: microsite
        run: npm ci

      - name: Build
        working-directory: microsite
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=yopass-site --branch=master --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          workingDirectory: microsite
          wranglerVersion: "4.81.0"

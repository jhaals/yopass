apiVersion: apps/v1
kind: Deployment
metadata:
  name: yopass
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yopass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yopass
    spec:
      containers:
        - name: yopass
          image: jhaals/yopass
          args:
            - "--database=redis"
            - "--redis=redis://localhost:6379/0"
          ports:
            - name: http
              containerPort: 1337
          resources:
            limits:
              cpu: 100m
              memory: 50Mi
            requests:
              cpu: 100m
              memory: 50Mi
        - name: yopass-valkey
          image: valkey/valkey:8-alpine
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 100Mi
          # Keep secrets in memory only: no snapshots, no append-only file.
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            # Refuse writes when full instead of being OOM-killed.
            - "--maxmemory"
            - "64mb"
          ports:
            - name: valkey
              containerPort: 6379
---
kind: Service
apiVersion: v1
metadata:
  name: yopass
spec:
  selector:
    app.kubernetes.io/name: yopass
  type: ClusterIP
  ports:
    - name: http
      port: 1337

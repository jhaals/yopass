version: "3.8"

services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: always
    # Keep secrets in memory only: no snapshots, no append-only file.
    command: valkey-server --save "" --appendonly no
    expose:
      - "6379"

  yopass:
    image: jhaals/yopass
    restart: always
    ports:
      - "127.0.0.1:80:80"
    environment:
      - DATABASE=redis
      - REDIS=redis://valkey:6379/0
      - PORT=80
    depends_on:
      - valkey
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
